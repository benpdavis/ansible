---
services:
  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Europe/London
    volumes:
      - /Apps/radarr/config:/config
      - /mnt/md0/Video/Movies:/Movies
      - /mnt/md0/Downloads:/Downloads #optional  
    restart: unless-stopped
