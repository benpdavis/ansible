---
services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - /Apps/sabnzbd/config:/config
      - /mnt/md0/Downloads:/Downloads #optional
    ports:
      - 8080:8080
    restart: unless-stopped
