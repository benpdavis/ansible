---
services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - /Apps/lidarr/appdata/config:/config
      - /mnt/md0/Audio/Music:/Music #optional
      - /mnt/md0/Downloads:/Downloads #optional
    ports:
      - 8686:8686
    restart: unless-stopped
