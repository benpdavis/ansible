---
services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    hostname: node2
    restart: unless-stopped
    ports:
      - 32400:32400/tcp
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      - TZ=Europe/London
      - PLEX_CLAIM=PLEX_CLAIM #https://www.plex.tv/claim
      - ADVERTISE_IP=http://node2:32400/
    volumes:
      - /Apps/plex/config:/config
      - /tmp/transcode:/transcode
      - /media/md0/Audio/Music:/Music
      - /media/md0/Video/Movies:/Movies
      - /media/md0/Video/Series:/Series
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    hostname: node2
    restart: 'unless-stopped'
    ports:
      - 8096:8096
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      - JELLYFIN_PublishedServerUrl=http://node2:8096 # Optional - alternative address used for autodiscovery
    volumes:
      - /Apps/jellyfin/config:/config
      - /media/md0/Audio/Music:/Music
      - /media/md0/Video/Movies:/Movies
      - /media/md0/Video/Series:/Series
